<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0E3B2E" />
    <title>Hors ligne — Salam Stock</title>
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        /* Pas de Plus Jakarta Sans : on est hors ligne, Google Fonts est
           inaccessible. System font stack = aucune latence, rendu propre
           sur tous les OS. */
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background-color: #0E3B2E;
        color: #FFFFFF;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        padding-top: max(24px, env(safe-area-inset-top));
        padding-bottom: max(24px, env(safe-area-inset-bottom));
        text-align: center;
        -webkit-font-smoothing: antialiased;
      }
      .icon-wrap {
        width: 96px;
        height: 96px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 32px;
      }
      .icon-wrap svg {
        width: 48px;
        height: 48px;
        stroke: #FFFFFF;
      }
      h1 {
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 12px;
        letter-spacing: -0.01em;
      }
      p {
        font-size: 16px;
        opacity: 0.85;
        max-width: 320px;
        line-height: 1.5;
        margin-bottom: 32px;
      }
      button {
        background-color: #FFFFFF;
        color: #0E3B2E;
        border: none;
        padding: 14px 32px;
        font-size: 16px;
        font-weight: 600;
        border-radius: 9999px;
        cursor: pointer;
        font-family: inherit;
        transition: opacity 0.15s ease;
        /* iOS tap highlight off */
        -webkit-tap-highlight-color: transparent;
        min-width: 200px;
        min-height: 48px;
      }
      button:active { opacity: 0.85; }
      .small {
        margin-top: 24px;
        font-size: 13px;
        opacity: 0.55;
      }
    </style>
  </head>
  <body>
    <div class="icon-wrap" aria-hidden="true">
      <!-- Cloud-off icon, inline pour pas dépendre d'un fetch externe -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m2 2 20 20" />
        <path d="M5.782 5.782A7 7 0 0 0 9 19h8.5a4.5 4.5 0 0 0 1.307-.193" />
        <path d="M21.532 16.5A4.5 4.5 0 0 0 17.5 10h-1.79A7.008 7.008 0 0 0 10 5.07" />
      </svg>
    </div>
    <h1>Connexion perdue</h1>
    <p>
      Salam Stock a besoin du réseau pour synchroniser le stock.
      Vérifiez la 4G ou le Wi-Fi du magasin et réessayez.
    </p>
    <button type="button" onclick="window.location.reload()">
      Réessayer
    </button>
    <p class="small">Salam Stock — K &amp; A FOOD</p>
  </body>
</html>
